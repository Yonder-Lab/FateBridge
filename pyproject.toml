# setuptools>=77 is required for the PEP 639 SPDX ``license``/``license-files``
# expression used below (older setuptools rejects the string form).
[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatebridge"
# Single source of truth: fatebridge/__init__.py::__version__. REST (api.py),
# MCP (mcp_server.py) and the packaging metadata all read that one value.
dynamic = ["version"]
description = "FateBridge - A Model Context Protocol (MCP) server bridging ancient Chinese fortune telling wisdom with modern technology"
authors = [{name = "thomas-yanxin", email = "yx20001210@163.com"}]
# PEP 639: SPDX expression + explicit license files (LICENSE + NOTICE, the
# latter required by Apache-2.0 §4d). The old ``License ::`` classifier is
# intentionally dropped — setuptools>=77 rejects it alongside an SPDX string.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.1",
    "fastmcp>=3.0.0",
    "kerykeion>=5.5.0",
    "lunardate>=0.2.2",
    "pydantic>=2.0.0",
    "pyswisseph>=2.10.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pyyaml>=6.0",  # test_skills_interface_contract parses agents/interface.yaml
]
iztro-verify = [
    # pinned <0.2: the committed horoscope oracle fixture was generated with
    # 0.1.5; a major bump could silently change reference values.
    "py-iztro>=0.1.5,<0.2",
]

[project.scripts]
fatebridge = "fatebridge.cli:main"
fatebridge-api = "fatebridge.api:main"
fatebridge-mcp = "fatebridge.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "fatebridge.__version__"}

[tool.setuptools.packages.find]
include = ["fatebridge*"]

# packages.find discovers *code* only. The engines load their reference data at
# runtime via ``Path(__file__).parents[1] / "data" / ...`` (canping, heluo,
# knowledge_store), so the JSON payloads MUST be declared here or an installed
# wheel raises FileNotFoundError. ``py.typed`` ships the PEP 561 typed marker.
[tool.setuptools.package-data]
fatebridge = ["py.typed", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "dateutil",
    "dateutil.*",
    "fastmcp",
    "fastmcp.*",
    "kerykeion",
    "lunardate",
    "lunardate.*",
    "pytz",
    "swisseph",
    "yaml",
]
ignore_missing_imports = true
