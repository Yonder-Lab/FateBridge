[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatebridge-mcp"
version = "0.1.0"
description = "FateBridge - A Model Context Protocol (MCP) server bridging ancient Chinese fortune telling wisdom with modern technology"
authors = [{name = "User", email = "user@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.109.0",
    "fastmcp>=3.0.0",
    "kerykeion>=5.5.0",
    "lunardate>=0.2.2",
    "pydantic>=2.0.0",
    "pyswisseph>=2.10.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
iztro-verify = [
    "py-iztro>=0.1.5",
]

[project.scripts]
fatebridge = "fatebridge.cli:main"
fatebridge-api = "api:main"
fatebridge-mcp = "fastmcp_server:main"

[tool.setuptools.packages.find]
include = ["fatebridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "dateutil",
    "dateutil.*",
    "fastmcp",
    "fastmcp.*",
    "kerykeion",
    "lunardate",
    "lunardate.*",
    "pytz",
    "swisseph",
]
ignore_missing_imports = true
