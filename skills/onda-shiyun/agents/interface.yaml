# Machine-readable interface for the onda-shiyun skill.
# Enforced by tests/test_skills_interface_contract.py against the FateBridge
# engine catalog and this skill's SKILL.md. Keep in sync or CI fails.
name: onda-shiyun
version: 0.1.0
scenario: 人生时运 · 择时
summary: 用 FateBridge 引擎看大运流年、今年运势、人生转折、择时择日，含西占推运全套，Onda 河狸把时间线讲成能准备的节奏
triggers:
  - 今年运势
  - 明年怎么样
  - 大运
  - 流年
  - 流月
  - 人生转折点
  - 什么时候适合做某事
  - 择日
  - 本命年
  - 最近为什么不顺
  - 运势起伏
engine_tools:
  - astro_balbillus
  - astro_distributions
  - astro_extrareturns
  - astro_harmonic
  - astro_keypoints
  - astro_lunation_phase
  - astro_mundane
  - astro_planetary_ages
  - astro_planetaryarc
  - astro_triplicity_rulers
  - astro_yearsystem129
  - decennials
  - firdaria
  - jieqi_timeline_analysis
  - jieqi_year
  - liunian_analysis
  - liuri_analysis
  - liushi_analysis
  - liuyue_analysis
  - nongli_time
  - pd
  - profection
  - solararc
  - solarreturn
  - timing_analysis
  - transit
  - zr
required_inputs:
  - birth_year
  - birth_month
  - birth_day
  - birth_hour
  - gender
  - birth_place
  - analysis_year
reads:
  - ../../_shared/fatebridge-engine.md
  - ../../_shared/onda-counsel.md
output:
  kind: interpretation        # 人类可读解读，非原始命盘字段
  grounding: engine_fields    # 结论溯源到引擎字段，AI 不手算
  voice: onda-counsel
boundary: 传统术数与占星的文化参考视角，不是决定论，不替代医疗、心理、法律、财务等专业意见。
