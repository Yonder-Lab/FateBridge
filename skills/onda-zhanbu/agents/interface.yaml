- 求一卦
- 占卜
- 起卦
- 梅花易数
- 六爻
- 奇门
- 大六壬
- 金口诀
- 太乙
- 星骰
- 这事吉凶
engine_tools:
- astro_horary
- gua_lookup
- gua_meiyi
- jinkou
- liureng_gods
- liureng_runyear
- meihua_analysis
- otherbu
- qimen
- sanshiunited
- sixyao
- suzhan
- taiyi
- tongshefa
required_inputs: []
reads:
- ../../_shared/fatebridge-engine.md
- ../../_shared/onda-counsel.md
output:
  kind: interpretation
  grounding: engine_fields
  voice: onda-counsel
  deliverables:
  - 本次问题与问时
  - 卦变或盘局的关键依据
  - 传统提示与现实验证条件
boundary: 传统术数与占星的文化参考视角，不是决定论，不替代医疗、心理、法律、财务等专业意见。
license: Apache-2.0
input_notes:
- 必需输入由所选卜法决定；时间梅花核对问题及起卦年月日时/时区
- 手摇或已有卦例沿用原始记录；不得静默改为时间或随机起卦
- tongshefa 是已有四卦的确定性组合，不实现蓍草十八变；不得用固定默认充当用户起卦
- otherbu 解读用户实际骰面，不自动随机抽骰；不得以默认值代替实际抽取
