# Machine-readable scenario interface; validated against SKILL.md and engine catalog.
name: onda-zhanbu
version: 0.2.0
scenario: 抉择 · 问事占卜
summary: 围绕一件事呈现卦变或盘局依据，整理现实中需确认的条件与下一步
triggers:
- 求卦辅助一个具体决定
