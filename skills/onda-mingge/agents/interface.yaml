# Machine-readable interface for the onda-mingge skill.
# Enforced by tests/test_skills_interface_contract.py against the FateBridge
# engine catalog and this skill's SKILL.md. Keep in sync or CI fails.
name: onda-mingge
version: 0.1.0
scenario: 认识自己 · 性格天赋
summary: 用 FateBridge 引擎看性格、天赋、学业、原生家庭与人生底色，Onda 河狸帮人更懂自己一点
triggers:
  - 我是个什么样的人
  - 我的性格
  - 天赋适合什么
  - 学业
  - 考试运
  - 孩子的命
  - 跟父母
  - 兄弟的关系
  - 原生家庭
  - 我适合走什么路
  - 紫微命盘
  - 综合命理
engine_tools:
  - analyze_destiny
  - astro_chart
  - bazi_birth
  - bazi_children
  - bazi_education
  - bazi_personality
  - bazi_relatives
  - canping
  - heluo
  - ziwei_birth
  - ziwei_rules
required_inputs:
  - birth_year
  - birth_month
  - birth_day
  - birth_hour
  - gender
  - birth_place
reads:
  - ../../_shared/fatebridge-engine.md
  - ../../_shared/onda-counsel.md
output:
  kind: interpretation        # 人类可读解读，非原始命盘字段
  grounding: engine_fields    # 结论溯源到引擎字段，AI 不手算
  voice: onda-counsel
boundary: 传统术数与占星的文化参考视角，不是决定论，不替代医疗、心理、法律、财务等专业意见。
