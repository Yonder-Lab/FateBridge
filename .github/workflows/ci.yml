name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check formatting
        run: black --check api.py fastmcp_server.py fatebridge/utils/helpers.py fatebridge/utils/runtime.py tests

      - name: Check import order
        run: isort --check-only api.py fastmcp_server.py fatebridge/utils/helpers.py fatebridge/utils/runtime.py tests

      - name: Run type checks
        run: mypy --follow-imports=silent api.py fastmcp_server.py fatebridge/utils/helpers.py fatebridge/utils/runtime.py
