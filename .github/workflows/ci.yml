name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    # 固定到 ubuntu-24.04（而非 ubuntu-latest）：golden 基线是平台相关的字节锁，
    # runner OS 升级会改变 libm/星历浮点，必须与基线冻结平台锁步。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check formatting
        run: black --check fatebridge scripts tests

      - name: Check import order
        run: isort --check-only fatebridge scripts tests

      - name: Run type checks
        run: mypy fatebridge/

  floor:
    # Install every direct dependency at its declared minimum so a too-low
    # version floor surfaces here instead of in a user's environment. The main
    # `test` job always resolves to the latest releases and would never catch it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies at declared minimums
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Run tests
        # 最低依赖版本的星历输出与「最新版」基线不同口径，关闭 golden 字节比对；
        # floor 只为守 API 下限，数值锁由 test 作业负责。
        env:
          FATEBRIDGE_SKIP_GOLDEN_DIFF: "1"
        run: pytest -q
