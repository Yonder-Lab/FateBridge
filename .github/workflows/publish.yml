name: Publish to PyPI

# Publishes on a GitHub Release. Trusted Publishing (OIDC) — no API tokens or
# secrets. One-time setup on PyPI: Project → Publishing → add a GitHub
# publisher for repo Yonder-Lab/FateBridge, workflow `publish.yml`,
# environment `pypi`.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # setuptools reads __version__ from source (static), but keep full
          # history so any future switch to a git-tag version scheme works.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata and long-description rendering
        run: twine check dist/*

      - name: Assert reference data is packaged
        # Guards the exact bug this workflow was born with: a wheel that omits
        # fatebridge/data/**/*.json installs but crashes at runtime.
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          jsons = [n for n in names if n.endswith(".json") and "/data/" in n]
          assert jsons, f"no data JSON in wheel {wheel} — package-data missing"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing"
          print(f"OK: {len(jsons)} data JSON files + py.typed present in wheel")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
