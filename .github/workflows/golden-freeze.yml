name: Golden Freeze

# 手动触发：在 CI 平台（ubuntu-24.04 x86_64，与 test 作业同口径）冻结 golden 基线，
# 作为 artifact 上传。星历浮点是平台相关的，基线必须在此平台生成才能被 test 作业
# 字节比对。用法：触发本工作流 → 下载 artifact → 覆盖 tests/golden/snapshots/ → 提交。
on:
  workflow_dispatch:

jobs:
  freeze:
    # 必须与 ci.yml 的 test 作业同一平台，否则基线无法字节匹配。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Freeze golden baselines
        run: python -m tests.golden.runner

      - name: Upload snapshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-snapshots
          path: tests/golden/snapshots/
          if-no-files-found: error
